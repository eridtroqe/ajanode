<div class="container">
  <div class="row justify-content-center">
<mat-card>
  <mat-card-title>Krijo prone</mat-card-title>
  <!-- <mat-spinner *ngIf="isLoading"></mat-spinner> -->
  <form [formGroup]="form" (submit)="onAddPost()">
    <mat-form-field>
      <input matInput type="text" formControlName="title" placeholder="Titulli">
      <mat-error *ngIf="form.get('title').invalid">Vendosni nje titull</mat-error>
    </mat-form-field>
    <mat-form-field>
      <input matInput type="text" formControlName="address" placeholder="Adresa">
      <mat-error *ngIf="form.get('address').invalid">Vendosni adresen</mat-error>
    </mat-form-field>
    <div class="row">
    <mat-form-field class="col-md-6">
      <mat-label>Tipologjia</mat-label>
      <mat-select formControlName="typology">
        <mat-option [value]="'1+1'">1 + 1</mat-option>
        <mat-option [value]="'2+1'">2 + 1</mat-option>
        <mat-option [value]="'3+1'">3 + 1</mat-option>
      </mat-select>
    <mat-error *ngIf="form.get('typology').invalid">Zgjidhni tipologjine</mat-error>
    </mat-form-field>
    <mat-form-field class="col-md-6">
      <input matInput type="text" formControlName="price" placeholder="Cmimi">
      <span matSuffix>&euro;</span>
      <mat-error *ngIf="form.get('price').invalid">Vendosni cmimin</mat-error>
    </mat-form-field>
  </div>
    <div class="row">
    <mat-form-field class="col-md-2">
      <input matInput type="number" formControlName="sip" placeholder="Sip">
      <span matSuffix>m2</span>
      <mat-error *ngIf="form.get('sip').invalid">Vendosni siperfaqen</mat-error>
    </mat-form-field>
    <mat-form-field class="col-md-2">
      <input matInput type="number" formControlName="rooms" placeholder="Dhoma">
      <mat-error *ngIf="form.get('rooms').invalid">Vendosni nr e dhomave</mat-error>
    </mat-form-field>
    <mat-form-field class="col-md-2">
      <input matInput type="number" formControlName="toilets" placeholder="Tualete">
      <mat-error *ngIf="form.get('toilets').invalid">Vendosni nr e tualeteve</mat-error>
    </mat-form-field>
    <mat-form-field class="col-md-2">
      <input matInput type="number" formControlName="floor" placeholder="Kati">
      <mat-error *ngIf="form.get('floor').invalid">Vendosni katin</mat-error>
    </mat-form-field>
    <mat-form-field class="col-md-4">
      <mat-label>Qera / Shitje</mat-label>
      <mat-select formControlName="type">
        <mat-option [value]="'Rent'">Qera</mat-option>
        <mat-option [value]="'Sale'">Shitje</mat-option>
      </mat-select>
    <mat-error *ngIf="form.get('type').invalid">Zgjidhni nje nga opsionet</mat-error>
    </mat-form-field>
    </div>
     <ng-container *ngIf="(isInProgress$ | async) && progress$ | async as progress">
      <mat-progress-bar class="mb-1"  [value]="progress"></mat-progress-bar>
      <div class="text-center"> {{progress }} %</div>
    </ng-container>
    <div style="margin-bottom: 1rem;" *ngIf="(isReady$ | async) || (hasFailed$ | async)">
      <button mat-stroked-button type="button" (click)="filePicker.click()">Zgjidh fotot</button>
      <input type="file" multiple #filePicker (change)="onImagePicked($event)">
    </div>
    <div class="image-preview" *ngIf="imagePreview !== [] && imagePreview && form.get('imagePath').valid">
      <img *ngFor='let url of imagePreview'  [src]="url" height="150" width="200px" style="margin: 3px;" [alt]="form.value.title">
    </div>
    <!-- <mat-error *ngIf="form.get('imagePath').invalid">Please enter a valid format image.</mat-error> -->
    <mat-form-field>
      <textarea matInput rows="7" formControlName="description" placeholder="Pershkrimi"></textarea>
      <mat-error *ngIf="form.get('description').invalid">Vendosni nje pershkrim</mat-error>
    </mat-form-field>
    <mat-card-actions>
    <button mat-raised-button color="accent" type="submit" [disabled]="(isLoading$ | async) || this.form.invalid">
      <fa-icon [icon]="faSpinner" spin='true' *ngIf="isLoading$ | async"></fa-icon>
      Shto pronen
    </button>
  </mat-card-actions>
  </form>
</mat-card>
</div>
</div>
