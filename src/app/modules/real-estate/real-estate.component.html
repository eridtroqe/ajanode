<div class="container-fluid">
<div class="row" *ngIf="properties$ | async as properties">
 <div class="col-md-3 card-padding" *ngFor="let property of properties"> 
  <app-card-real-estate  [property]='property'></app-card-real-estate>
</div>

<mat-paginator
class="col-md-12"
[length]="totalProperties$ | async"
[pageSize]="postsPerPage"
[pageSizeOptions]="[8,12,16,20]"
(page)="onChangedPage($event)"
[showFirstLastButtons]="true"></mat-paginator>
</div>
</div>
