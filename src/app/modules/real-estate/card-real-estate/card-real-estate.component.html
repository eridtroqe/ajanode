<mat-card class="card">
  <img mat-card-image [src]="property.imagePath[0]" [alt]="property.title">
  <mat-card-title class="my-2">{{ property.title }}</mat-card-title>
  <mat-card-subtitle class="d-flex align-items-center my-3">
    <mat-icon>location_on</mat-icon> &nbsp;
    <span class="align-middle">{{ property.address }}</span>
  </mat-card-subtitle>
  <mat-card-content style="margin-bottom: 0;">
    <mat-chip-list>
      <mat-chip color="warn" selected>{{ property.type }}</mat-chip>
    </mat-chip-list>
    <mat-card-content class="py-1 price-description">
      <div class="row d-flex p-3">
        <div class="price d-flex justify-content-start align-items-center align-middle">
          <mat-icon>euro</mat-icon>
          <span>{{ property.price }}</span>
        </div>
        <div class=" col-md-4 align-self-end">/ muaj</div>
      </div>

    </mat-card-content>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-content>
    <div class="row justify-content-around description p-3">
      <div class="d-flex flex-column">Sip.<span class="mt-2">{{ property.sip }} m<sup>2</sup></span></div>
      <div  class="d-flex flex-column">Dhoma <span class="mt-2">{{ property.rooms }}</span></div>
      <div  class="d-flex flex-column">Tualet <span class="mt-2">{{ property.toilets }}</span></div>
      <div  class="d-flex flex-column">Kati <span class="mt-2">{{ property.floor }}</span></div>
    </div>

  </mat-card-content>
</mat-card>
