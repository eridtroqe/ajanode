<mat-card style="position: relative;" class="mat-elevation-z0">
  <div class="bg-image"></div>

  <mat-card-content class="d-flex flex-column justify-content-center">
    <div class="container-fluid">
      <div class="row">
        <img
        src="../../../../assets/logo/aja_logo.png"
        alt="logo"
        class="logo animated slideInDown slow"
      />
      </div>
      <div class="row justify-content-center">
        <mat-form-field color="accent" appearance="outline" class="search-input animated fadeInUp">
          <input matInput  placeholder="Search..." />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>
    </div>



  </mat-card-content>
</mat-card>
