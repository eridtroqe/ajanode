<div class="container" *ngIf="blog$ | async as blog">
  <div class="row justify-content-center">
    <mat-card class="col-md-10 mx-1">
      <img  class="blog-image" [src]="blog.imagePath">
      <h1>{{ blog.title }}</h1>
      <mat-card-content>
        <quill-view-html [content]="blog.content" theme="snow"></quill-view-html>
      </mat-card-content>
    </mat-card>
  </div>
</div>
