<mat-toolbar color="primary" class="mat-elevation-z10" >
  <mat-toolbar-row style="height: fit-content;">
    <app-contact-header class="mat-body-1"></app-contact-header>
  </mat-toolbar-row>
  <mat-toolbar-row >
    <button mat-button class="d-md-none">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="col-7">
      <img
        class="logo"
        src="../../../../assets/logo/aja_logo_white.png"
        alt="logo"
      />
    </div>
    <app-menu-header class="d-none d-md-block col-5"></app-menu-header>
  </mat-toolbar-row>
</mat-toolbar>
